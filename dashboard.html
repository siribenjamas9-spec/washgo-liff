<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Wash & Go Dashboard</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--navy:#0A1628;--blue:#1A4F8A;--sky:#2E86DE;--teal:#00BFA5;--gold:#FFB300;--green:#00C853;--red:#FF1744;--orange:#FF6D00;--white:#FFFFFF;--gray:#78909C;--card:rgba(255,255,255,0.06);--bdr:rgba(255,255,255,0.10);--r:16px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{font-family:'Noto Sans Thai',system-ui,sans-serif;background:var(--navy);color:var(--white);min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
#loading{position:fixed;inset:0;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:999;transition:opacity 0.4s}
#loading.out{opacity:0;pointer-events:none}
.spin{width:48px;height:48px;border-radius:50%;border:3px solid rgba(255,255,255,0.1);border-top-color:var(--teal);animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#app{display:none;min-height:100vh}
#app.show{display:block}
.header{padding:16px 20px 12px;background:rgba(10,22,40,0.95);backdrop-filter:blur(20px);position:sticky;top:0;z-index:50;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between}
.header-left{display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--orange));display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 3px 12px rgba(255,179,0,0.4)}
.header-title{font-size:16px;font-weight:700}
.header-sub{font-size:11px;color:var(--gray);margin-top:1px}
.mode-badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.5px}
.mode-admin{background:rgba(255,183,0,0.15);border:1px solid rgba(255,183,0,0.4);color:var(--gold)}
.mode-member{background:rgba(0,191,165,0.15);border:1px solid rgba(0,191,165,0.4);color:var(--teal)}
.body{padding:16px;max-width:480px;margin:0 auto}
.section{font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:1.5px;margin:20px 0 10px}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi-card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;position:relative;overflow:hidden}
.kpi-label{font-size:10px;color:var(--gray);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.kpi-val{font-family:'Bebas Neue',sans-serif;font-size:32px;line-height:1;color:var(--accent,var(--sky))}
.kpi-sub{font-size:10px;margin-top:4px}
.up{color:var(--green)}.down{color:var(--red)}.neutral{color:var(--gray)}
.stamp-card{background:linear-gradient(135deg,#0D2137,#1A4F8A);border:1px solid rgba(46,134,222,0.4);border-radius:var(--r);padding:20px;box-shadow:0 8px 32px rgba(0,0,0,0.4);position:relative;overflow:hidden}
.stamp-card::after{content:'🧺';position:absolute;right:-10px;bottom:-10px;font-size:80px;opacity:0.08;transform:rotate(-15deg)}
.stars-row{display:flex;gap:6px;margin-bottom:14px}
.star{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all 0.3s}
.star.filled{background:rgba(255,179,0,0.25);border:1px solid var(--gold);box-shadow:0 0 8px rgba(255,179,0,0.3);animation:pop 0.4s ease}
.star.empty{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1)}
@keyframes pop{0%{transform:scale(0.5)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.stamp-progress{height:6px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden}
.stamp-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--orange));width:0%;transition:width 1s cubic-bezier(0.34,1.56,0.64,1)}
.coupon{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:14px}
.coupon-code{font-size:15px;font-weight:700;color:var(--gold);letter-spacing:1px}
.coupon-detail{font-size:12px;color:var(--gray);margin-top:2px}
.coupon-badge{margin-left:auto;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(0,200,83,0.15);border:1px solid rgba(0,200,83,0.4);color:var(--green)}
.tx-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bdr)}
.tx-row:last-child{border:none}
.tx-bank{font-size:13px;font-weight:600;color:var(--white)}
.tx-date{font-size:11px;color:var(--gray);margin-top:2px}
.tx-amt{font-size:16px;font-weight:700;color:var(--teal)}
.alert-none{background:rgba(0,200,83,0.08);border:1px solid rgba(0,200,83,0.3);border-radius:12px;padding:12px;text-align:center;font-size:13px;color:var(--green)}
.alert-box{background:rgba(255,23,68,0.1);border:1px solid rgba(255,23,68,0.4);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:flex-start}
.refresh-btn{width:100%;padding:14px;border-radius:var(--r);border:none;background:linear-gradient(135deg,var(--blue),var(--sky));color:var(--white);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-top:16px;box-shadow:0 4px 16px rgba(46,134,222,0.3);transition:all 0.2s}
.refresh-btn:active{transform:scale(0.97)}
.fade-in{animation:fadeIn 0.4s ease forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="loading">
  <div class="spin"></div>
  <div style="font-size:14px;color:rgba(255,255,255,0.6)">กำลังโหลด...</div>
</div>

<div id="app">
  <div class="header">
    <div class="header-left">
      <div class="logo-icon">🧺</div>
      <div>
        <div class="header-title">Wash &amp; Go</div>
        <div class="header-sub" id="headerSub">@667otwdx · หัวทะเล</div>
      </div>
    </div>
    <div class="mode-badge" id="modeBadge">โหลด...</div>
  </div>
  <div class="body fade-in" id="mainContent"></div>
</div>

<script>
const LIFF_ID    = '2010079998-4SOKEvMi';
const GAS_URL    = 'https://script.google.com/macros/s/AKfycbypj-l5KNovRjE1MI7ASadFXAp1uCKOJ90wX743XEr2sByvWMBNZ5EON4u2Ufk-X-xS/exec';
const ADMIN_UIDS = ['U7b909c85e7e47cbd6b403626ed591b6f']; // ← ใส่ LINE UID ของคุณ

async function main() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const profile = await liff.getProfile();
    const isAdmin = ADMIN_UIDS.includes(profile.userId);
    document.getElementById('modeBadge').textContent = isAdmin ? '👑 Admin' : '⭐ สมาชิก';
    document.getElementById('modeBadge').className = 'mode-badge ' + (isAdmin ? 'mode-admin' : 'mode-member');
    isAdmin ? await renderAdmin() : await renderMember(profile);
  } catch(e) {
    await renderMember({ userId: 'DEV001', displayName: 'Dev' });
  }
  document.getElementById('loading').classList.add('out');
  setTimeout(() => {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').classList.add('show');
  }, 400);
}

async function renderAdmin() {
  document.getElementById('headerSub').textContent = 'Executive Dashboard';
  let d = {};
  try {
    const res = await fetch(GAS_URL + '?action=dashboard_admin');
    d = await res.json();
  } catch(e) {
    d = { revenue:0, txCount:0, avgTicket:0, anomaly:0, totalMembers:0, newToday:0, date:'-' };
  }
  document.getElementById('mainContent').innerHTML = `
    <p class="section">วันนี้ ${d.date||''}</p>
    <div class="kpi-grid">
      <div class="kpi-card" style="--accent:var(--teal)">
        <div class="kpi-label">รายได้</div>
        <div class="kpi-val">฿${(d.revenue||0).toLocaleString()}</div>
        <div class="kpi-sub neutral">บาท</div>
      </div>
      <div class="kpi-card" style="--accent:var(--sky)">
        <div class="kpi-label">Transactions</div>
        <div class="kpi-val">${d.txCount||0}</div>
        <div class="kpi-sub neutral">ครั้ง</div>
      </div>
      <div class="kpi-card" style="--accent:var(--gold)">
        <div class="kpi-label">Avg Ticket</div>
        <div class="kpi-val">฿${d.avgTicket||0}</div>
        <div class="kpi-sub neutral">บาท/ครั้ง</div>
      </div>
      <div class="kpi-card" style="--accent:${d.anomaly>0?'var(--red)':'var(--green)'}">
        <div class="kpi-label">🚨 Anomaly</div>
        <div class="kpi-val">${d.anomaly||0}</div>
        <div class="kpi-sub ${d.anomaly>0?'down':'up'}">${d.anomaly>0?'⚠️ ตรวจสอบ':'✅ ปกติ'}</div>
      </div>
    </div>
    <p class="section">สมาชิก</p>
    <div class="kpi-grid">
      <div class="kpi-card" style="--accent:var(--teal)">
        <div class="kpi-label">สมาชิกทั้งหมด</div>
        <div class="kpi-val">${d.totalMembers||0}</div>
        <div class="kpi-sub neutral">คน</div>
      </div>
      <div class="kpi-card" style="--accent:var(--green)">
        <div class="kpi-label">สมัครวันนี้</div>
        <div class="kpi-val">${d.newToday||0}</div>
        <div class="kpi-sub neutral">คนใหม่</div>
      </div>
    </div>
    <p class="section">สถานะระบบ</p>
    ${d.anomaly>0
      ? `<div class="alert-box"><div style="font-size:20px">🚨</div><div style="font-size:13px">พบ <strong>${d.anomaly} รายการ</strong>ผิดปกติ<br>เปิด Google Sheets → Anomaly_Log</div></div>`
      : `<div class="alert-none">✅ ไม่พบความผิดปกติวันนี้</div>`}
    <p class="section">Quick Links</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      ${[
        {icon:'📊',label:'Looker Studio',url:'https://lookerstudio.google.com'},
        {icon:'📋',label:'Google Sheets',url:'https://docs.google.com/spreadsheets/d/1ILwABW4ZgJQ7ftyk8mqBV9E4k5YSLyvfZ22IpoKBI1A'},
        {icon:'👥',label:'LINE OA Manager',url:'https://manager.line.biz'},
        {icon:'⚙️',label:'Apps Script',url:'https://script.google.com'},
      ].map(l=>`<a href="${l.url}" target="_blank" style="display:flex;align-items:center;gap:10px;padding:12px;background:var(--card);border:1px solid var(--bdr);border-radius:12px;text-decoration:none;color:var(--white)"><span style="font-size:20px">${l.icon}</span><span style="font-size:12px;font-weight:600">${l.label}</span></a>`).join('')}
    </div>
    <button class="refresh-btn" onclick="location.reload()">🔄 รีเฟรชข้อมูล</button>`;
}

async function renderMember(profile) {
  let d = {};
  try {
    const res = await fetch(`${GAS_URL}?action=member_data&uid=${profile.userId}`);
    d = await res.json();
  } catch(e) {
    d = { name:profile.displayName||'สมาชิก', stamps:0, stampThreshold:10, stampReward:50, coupons:[], recentTx:[], totalSpend:0, stage:'REGISTERED' };
  }
  if (d.error === 'NOT_MEMBER') {
    document.getElementById('mainContent').innerHTML = `
      <div style="text-align:center;padding:40px 20px">
        <div style="font-size:48px;margin-bottom:12px">🧺</div>
        <div style="font-size:16px;font-weight:700;margin-bottom:6px">ยังไม่ได้สมัครสมาชิก</div>
        <div style="font-size:13px;color:var(--gray);margin-bottom:20px">สมัครฟรี รับสิทธิ์สะสมแต้มทันที</div>
        <button class="refresh-btn" style="max-width:220px;margin:0 auto" onclick="liff.openWindow({url:'https://liff.line.me/2010079998-4KL6SLaf',external:false})">📋 สมัครสมาชิก</button>
      </div>`; return;
  }
  const stamps = d.stamps||0, threshold = d.stampThreshold||10;
  const pct = Math.min(100, Math.round(stamps/threshold*100));
  const starsHTML = Array.from({length:threshold},(_,i)=>
    `<div class="star ${i<stamps?'filled':'empty'}" style="animation-delay:${i*0.08}s">${i<stamps?'⭐':'☆'}</div>`
  ).join('');
  document.getElementById('mainContent').innerHTML = `
    <p class="section">Stamp Card</p>
    <div class="stamp-card">
      <div style="font-size:13px;color:rgba(255,255,255,0.7);margin-bottom:4px">สวัสดี, ${d.name} 👋</div>
      <div style="font-size:13px;color:var(--white);margin-bottom:14px">
        แต้มสะสม <span style="font-family:'Bebas Neue';font-size:28px;color:var(--gold)">${stamps}</span> / ${threshold}
        ${stamps>=threshold?'🎉 ครบแล้ว!':`อีก ${threshold-stamps} ดวง = คูปอง ฿${d.stampReward}`}
      </div>
      <div class="stars-row">${starsHTML}</div>
      <div class="stamp-progress"><div class="stamp-fill" id="stampFill"></div></div>
      <div style="font-size:11px;color:rgba(255,255,255,0.5);margin-top:8px;text-align:center">ส่งสลิปโอนเงินทุกครั้งเพื่อสะสมแต้ม</div>
    </div>
    <p class="section">คูปองของฉัน</p>
    ${(d.coupons||[]).length===0
      ? `<div style="text-align:center;padding:20px;color:var(--gray);font-size:13px">ยังไม่มีคูปอง — สะสมครบ ${threshold} ดวง = คูปอง ฿${d.stampReward}</div>`
      : (d.coupons||[]).map(c=>`<div class="coupon"><div style="font-size:28px">🎟️</div><div><div class="coupon-code">${c.code}</div><div class="coupon-detail">ลด ฿${c.amount} · หมดอายุ ${c.expiry}</div></div><div class="coupon-badge">ใช้ได้</div></div>`).join('')}
    <p class="section">ประวัติล่าสุด</p>
    <div style="background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:4px 16px">
      ${(d.recentTx||[]).length===0
        ? `<div class="tx-row"><span style="color:var(--gray);font-size:13px">ยังไม่มีประวัติ</span></div>`
        : (d.recentTx||[]).map(tx=>`<div class="tx-row"><div><div class="tx-bank">🧺 ใช้บริการ</div><div class="tx-date">${tx.date}</div></div><div class="tx-amt">+฿${tx.amount}</div></div>`).join('')}
    </div>
    <p class="section">สถิติของฉัน</p>
    <div class="kpi-grid">
      <div class="kpi-card" style="--accent:var(--gold)">
        <div class="kpi-label">ยอดใช้รวม</div>
        <div class="kpi-val">฿${(d.totalSpend||0).toLocaleString()}</div>
        <div class="kpi-sub neutral">ตลอดการเป็นสมาชิก</div>
      </div>
      <div class="kpi-card" style="--accent:var(--teal)">
        <div class="kpi-label">สถานะ</div>
        <div class="kpi-val" style="font-size:14px;margin-top:4px">${
          d.stage==='COUPON_REDEEMED'?'👑 VIP':d.stage==='REPEAT_BUYER'?'⭐ ประจำ':d.stage==='FIRST_SLIP'?'🆕 ใหม่':'📋 สมาชิก'
        }</div>
      </div>
    </div>
    <div style="text-align:center;font-size:12px;color:var(--gray);padding:16px 0">
      Wash &amp; Go @667otwdx · เปิด 24 ชั่วโมง 🧺
    </div>`;
  setTimeout(() => {
    const f = document.getElementById('stampFill');
    if(f) f.style.width = pct+'%';
  }, 300);
}

main();
</script>
</body>
</html>
